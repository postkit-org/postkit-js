<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2F5BE3","options":["#2F5BE3","#B44A17","#23794A","#6E44D6"]},"$preview":{"width":1200,"height":630}}'>
class Component extends DCLogic {
  mix(hex, amount) {
    var h = String(hex || '#2F5BE3').replace('#', '');
    if (h.length === 3) h = h.split('').map(function (c) { return c + c; }).join('');
    var n = parseInt(h, 16);
    var r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    var to = function (c) { var s = Math.round(c + (255 - c) * amount).toString(16); return s.length === 1 ? '0' + s : s; };
    return '#' + to(r) + to(g) + to(b);
  }
  renderVals() {
    var accent = this.props.accent ?? '#2F5BE3';
    return { accent: accent, tint: this.mix(accent, 0.88) };
  }
}
