  <header style="padding-bottom: 56px">
    <p style="margin: 0 0 14px; font-size: 15px; color: #6E6E73">Components · <span class="m" style="font-size: 13px">@postkit/react/styles.css</span></p>
    <h1 style="margin: 0; max-width: 24ch; font-weight: 500; font-size: 56px; line-height: 1.05; letter-spacing: -0.03em">Foundations. <span class="g">The quiet baseline every component is built from.</span></h1>
  </header>
  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 64px">
    <section><ul style="margin: 0; padding: 0; list-style: none"><li style="padding: 18px 0; border-top: 1px solid #ECECEA"><p style="margin: 0; font-weight: 500; font-size: 19px">Quiet by default.</p><p style="margin: 4px 0 0; font-size: 15px; color: #6E6E73">The baseline has to sit inside someone else’s design without arguing with it.</p></li><li style="padding: 18px 0; border-top: 1px solid #ECECEA"><p style="margin: 0; font-weight: 500; font-size: 19px">Structure before decoration.</p><p style="margin: 4px 0 0; font-size: 15px; color: #6E6E73">Hierarchy comes from type, space and surface, not borders and shadows.</p></li><li style="padding: 18px 0; border-top: 1px solid #ECECEA"><p style="margin: 0; font-weight: 500; font-size: 19px">Colour means tone.</p><p style="margin: 4px 0 0; font-size: 15px; color: #6E6E73">Hue appears only where it carries meaning: a callout’s tone, a diff’s change, a chart’s series.</p></li><li style="padding: 18px 0; border-top: 1px solid #ECECEA"><p style="margin: 0; font-weight: 500; font-size: 19px">One set of names.</p><p style="margin: 4px 0 0; font-size: 15px; color: #6E6E73">Every token is a --postkit-* custom property, so a site restyles everything from one place.</p></li></ul></section>
    <section><h2 style="margin: 0 0 24px; font-weight: 500; font-size: 26px; letter-spacing: -0.02em">Variants</h2><div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px 28px; align-items: start"><div><p class="m" style="margin: 0 0 12px; font-size: 12px; color: #86868B">outline</p><div style="background: #FFFFFF; border: 1px solid #E2E2DF; border-radius: 14px; padding: 18px 20px"><p style="margin: 0 0 4px; font-weight: 500">Outline</p><p style="margin: 0; font-size: 15px; color: #3A3A3C">An edge, no fill. Reads as a card on any page.</p></div></div><div><p class="m" style="margin: 0 0 12px; font-size: 12px; color: #86868B">subtle · default</p><div style="background: #F5F5F4; border: 1px solid transparent; border-radius: 14px; padding: 18px 20px"><p style="margin: 0 0 4px; font-weight: 500">Subtle</p><p style="margin: 0; font-size: 15px; color: #3A3A3C">A quiet surface, no edge. The default for every component.</p></div></div><div><p class="m" style="margin: 0 0 12px; font-size: 12px; color: #86868B">plain</p><div style="background: transparent; border: 1px solid transparent; padding: 0"><p style="margin: 0 0 4px; font-weight: 500">Plain</p><p style="margin: 0; font-size: 15px; color: #3A3A3C">Structure and type only. For pages that bring their own rhythm.</p></div></div></div></section>
  </div>

<div style="display: flex; gap: 12px; align-items: center"><span style="flex: 0 0 44px; height: 44px; border-radius: 10px; background: #F5F5F7"></span><span><span class="m" style="display: block; font-size: 13px; color: #F5F5F7">--postkit-fg</span><span class="m" style="display: block; font-size: 12px; color: #A1A1A6">#F5F5F7</span></span></div><div style="display: flex; gap: 12px; align-items: center"><span style="flex: 0 0 44px; height: 44px; border-radius: 10px; background: #A1A1A6"></span><span><span class="m" style="display: block; font-size: 13px; color: #F5F5F7">--postkit-fg-muted</span><span class="m" style="display: block; font-size: 12px; color: #A1A1A6">#A1A1A6</span></span></div><div style="display: flex; gap: 12px; align-items: center"><span style="flex: 0 0 44px; height: 44px; border-radius: 10px; background: #8E8E93"></span><span><span class="m" style="display: block; font-size: 13px; color: #F5F5F7">--postkit-fg-subtle</span><span class="m" style="display: block; font-size: 12px; color: #A1A1A6">#8E8E93</span></span></div><div style="display: flex; gap: 12px; align-items: center"><span style="flex: 0 0 44px; height: 44px; border-radius: 10px; background: #6E8EF5"></span><span><span class="m" style="display: block; font-size: 13px; color: #F5F5F7">--postkit-accent</span><span class="m" style="display: block; font-size: 12px; color: #A1A1A6">#6E8EF5</span></span></div></div></div>

    <p style="margin: 16px 0 0; font-size: 15px; color: #6E6E73">Components inherit the host’s font family; the baseline sets only size, weight and rhythm. Weights are 400 and 500.</p>
