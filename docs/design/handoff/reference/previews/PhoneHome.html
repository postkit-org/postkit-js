  <section style="max-width: 1120px; margin: 0 auto; padding: 120px 24px 0; text-align: center">
    <p style="margin: 0 0 18px; font-size: 15px; color: #6E6E73">Postkit 0.3 · <a href="#" style="color: #1D1D1F; text-decoration: none">Works with your design system ›</a></p>
    <h1 style="margin: 0 auto; max-width: 22ch; font-weight: 500; font-size: clamp(44px, 6.4vw, 88px); line-height: 1.04; letter-spacing: -0.03em; text-wrap: balance">Richer posts, written once. <span class="q-g">Right everywhere they’re read.</span></h1>
    <p style="margin: 28px auto 0; max-width: 34em; font-size: 20px; line-height: 1.45; color: #6E6E73">Give your writing callouts, code, figures and 32 more without building any of them. Each post looks right on your site, in your newsletter and in your editor, from one plain-text file.</p>
    <div style="margin-top: 36px; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 12px 28px">

    </div>

        <div style="border-radius: 12px; background: #F5F5F4; padding: 16px 18px; margin-bottom: 20px">
          <p style="margin: 0 0 6px; font-size: 12.5px; color: #6E6E73">In short</p>

        </div>
        <p style="margin: 0 0 20px; font-size: 16px; line-height: 1.6; color: #3A3A3C">A callout is a small thing, but the moment an article leaves its page it has to survive a feed reader, a newsletter and an editor’s preview pane.</p>
