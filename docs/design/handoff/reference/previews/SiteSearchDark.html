      <h1 style="margin: 0; font-weight: 500; font-size: clamp(40px, 5vw, 64px); line-height: 1.04; letter-spacing: -0.03em; text-wrap: balance">Introduction. <span class="q-g">Rich posts that render right everywhere, from one plain-text file.</span></h1>
      <p style="margin: 24px 0 0; font-size: 19px; line-height: 1.6; color: #D1D1D6">Postkit gives your writing 35 ready-made components, from callouts to code to galleries, and renders them on your site, in your newsletter and in your editor. You keep your design, your framework and your content.</p>
      <section id="what" aria-labelledby="h-what" style="margin-top: 72px">
        <h2 id="h-what" style="margin: 0; font-weight: 500; font-size: 28px; line-height: 1.15; letter-spacing: -0.02em">What you get</h2>
<div style="margin-top: 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px"><div style="border-radius: 18px; background: #1C1C1E; padding: 20px 22px; "><p style="margin: 0 0 6px; font-weight: 500; font-size: 18px">Write once</p><p style="margin: 0; font-size: 15px; line-height: 1.55; color: #D1D1D6">Your writers use MDX or plain Markdown. The same 35 components work in both, and typos fail the build, not the reader.</p></div><div style="border-radius: 18px; background: #1C1C1E; padding: 20px 22px; "><p style="margin: 0 0 6px; font-weight: 500; font-size: 18px">Look like your site</p><p style="margin: 0; font-size: 15px; line-height: 1.55; color: #D1D1D6">Use the headless views with your own CSS, or the Chakra views with your theme. Readers never see a template.</p></div><div style="border-radius: 18px; background: #1C1C1E; padding: 20px 22px; "><p style="margin: 0 0 6px; font-weight: 500; font-size: 18px">Publish everywhere</p><p style="margin: 0; font-size: 15px; line-height: 1.55; color: #D1D1D6">The same file renders on your site, in your newsletter, in feeds and in Prismark, without a second copy to keep in sync.</p></div><div style="border-radius: 18px; background: #1C1C1E; padding: 20px 22px; "><p style="margin: 0 0 6px; font-weight: 500; font-size: 18px">Never boxed in</p><p style="margin: 0; font-size: 15px; line-height: 1.55; color: #D1D1D6">Restyle a part, swap a view, or eject the source into your repo. Your posts keep working at every step.</p></div></div>
      </section>
      <section id="how" aria-labelledby="h-how" style="margin-top: 72px">
        <h2 id="h-how" style="margin: 0; font-weight: 500; font-size: 28px; line-height: 1.15; letter-spacing: -0.02em">How it fits together</h2>
<style>@media (max-width:760px){.q-flow-arrow{flex-basis:100%;text-align:center;transform:rotate(90deg)}}</style>
