      <p style="margin: 0 0 16px; font-size: 15px; color: #6E6E73">Get started</p>
      <h1 style="margin: 0; font-weight: 500; font-size: clamp(40px, 5vw, 64px); line-height: 1.04; letter-spacing: -0.03em; text-wrap: balance">Introduction. <span class="q-g">Rich posts that render right everywhere, from one plain-text file.</span></h1>
      <p style="margin: 24px 0 0; font-size: 19px; line-height: 1.6; color: #3A3A3C">Postkit gives your writing 35 ready-made components, from callouts to code to galleries, and renders them on your site, in your newsletter and in your editor. You keep your design, your framework and your content.</p>
      <section id="what" aria-labelledby="h-what" style="margin-top: 72px">
        <h2 id="h-what" style="margin: 0; font-weight: 500; font-size: 28px; line-height: 1.15; letter-spacing: -0.02em">What you get</h2>
<div style="margin-top: 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px"><div style="border-radius: 18px; background: #F5F5F4; padding: 20px 22px; "><p style="margin: 0 0 6px; font-weight: 500; font-size: 18px">Write once</p><p style="margin: 0; font-size: 15px; line-height: 1.55; color: #3A3A3C">Your writers use MDX or plain Markdown. The same 35 components work in both, and typos fail the build, not the reader.</p></div><div style="border-radius: 18px; background: #F5F5F4; padding: 20px 22px; "><p style="margin: 0 0 6px; font-weight: 500; font-size: 18px">Look like your site</p><p style="margin: 0; font-size: 15px; line-height: 1.55; color: #3A3A3C">Use the headless views with your own CSS, or the Chakra views with your theme. Readers never see a template.</p></div><div style="border-radius: 18px; background: #F5F5F4; padding: 20px 22px; "><p style="margin: 0 0 6px; font-weight: 500; font-size: 18px">Publish everywhere</p><p style="margin: 0; font-size: 15px; line-height: 1.55; color: #3A3A3C">The same file renders on your site, in your newsletter, in feeds and in Prismark, without a second copy to keep in sync.</p></div><div style="border-radius: 18px; background: #F5F5F4; padding: 20px 22px; "><p style="margin: 0 0 6px; font-weight: 500; font-size: 18px">Never boxed in</p><p style="margin: 0; font-size: 15px; line-height: 1.55; color: #3A3A3C">Restyle a part, swap a view, or eject the source into your repo. Your posts keep working at every step.</p></div></div>
      </section>
      <section id="how" aria-labelledby="h-how" style="margin-top: 72px">
        <h2 id="h-how" style="margin: 0; font-weight: 500; font-size: 28px; line-height: 1.15; letter-spacing: -0.02em">How it fits together</h2>
<style>@media (max-width:760px){.q-flow-arrow{flex-basis:100%;text-align:center;transform:rotate(90deg)}}</style>
        <div role="img" aria-label="A post flows from plain text, through Postkit's definitions, to each renderer" style="margin-top: 24px; border-radius: 20px; background: #F5F5F4; padding: 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch">
          <div style="flex: 1 1 112px; min-width: 0; border-radius: 14px; background: #FFFFFF; padding: 14px 16px"><p class="q-mono" style="margin: 0; font-size: 11.5px; color: #6E6E73">post.mdx</p><p style="margin: 4px 0 0; font-weight: 500; color: #1D1D1F">Your post</p><p style="margin: 2px 0 0; font-size: 13.5px; color: #6E6E73">MDX or Markdown</p></div><span aria-hidden="true" class="q-flow-arrow" style="align-self: center; color: #86868B; font-size: 18px">→</span>
          <div style="flex: 1 1 112px; min-width: 0; border-radius: 14px; background: #1D1D1F; padding: 14px 16px"><p class="q-mono" style="margin: 0; font-size: 11.5px; color: #A1A1A6">@postkit/core</p><p style="margin: 4px 0 0; font-weight: 500; color: #F5F5F7">Definitions</p><p style="margin: 2px 0 0; font-size: 13.5px; color: #A1A1A6">Props, parts, validation</p></div><span aria-hidden="true" class="q-flow-arrow" style="align-self: center; color: #86868B; font-size: 18px">→</span>
          <div style="flex: 2.4 1 250px; min-width: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px">
            <div style="flex: 1 1 112px; min-width: 0; border-radius: 14px; background: #FFFFFF; padding: 14px 16px"><p class="q-mono" style="margin: 0; font-size: 11.5px; color: #6E6E73">@postkit/react</p><p style="margin: 4px 0 0; font-weight: 500; color: #1D1D1F">Headless</p><p style="margin: 2px 0 0; font-size: 13.5px; color: #6E6E73">Your CSS</p></div><div style="flex: 1 1 112px; min-width: 0; border-radius: 14px; background: #FFFFFF; padding: 14px 16px"><p class="q-mono" style="margin: 0; font-size: 11.5px; color: #6E6E73">@postkit/chakra</p><p style="margin: 4px 0 0; font-weight: 500; color: #1D1D1F">Chakra</p><p style="margin: 2px 0 0; font-size: 13.5px; color: #6E6E73">Your theme</p></div>
            <div style="flex: 1 1 112px; min-width: 0; border-radius: 14px; background: #FFFFFF; padding: 14px 16px"><p class="q-mono" style="margin: 0; font-size: 11.5px; color: #6E6E73">@postkit/email</p><p style="margin: 4px 0 0; font-weight: 500; color: #1D1D1F">Email</p><p style="margin: 2px 0 0; font-size: 13.5px; color: #6E6E73">Your newsletter</p></div><div style="flex: 1 1 112px; min-width: 0; border-radius: 14px; background: #FFFFFF; padding: 14px 16px"><p class="q-mono" style="margin: 0; font-size: 11.5px; color: #6E6E73">Prismark</p><p style="margin: 4px 0 0; font-weight: 500; color: #1D1D1F">Editor</p><p style="margin: 2px 0 0; font-size: 13.5px; color: #6E6E73">Live preview</p></div>
          </div>
        </div>
        <p style="margin: 16px 0 0; font-size: 17px; line-height: 1.65; color: #3A3A3C">Each component is defined once in <code class="q-mono" style="font-size: 14px">@postkit/core</code>: its props, its named parts and how it validates. Renderers only add presentation, so swapping one never touches your posts.</p>
