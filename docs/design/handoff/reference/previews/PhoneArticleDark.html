  <article style="--q-acc: {{accent}}; --q-tint: {{tint}}">
    <header style="max-width: 1120px; margin: 0 auto; padding: 112px 24px 0; text-align: center">
      <p style="margin: 0 0 18px; font-size: 15px; color: #A1A1A6"><a href="#" style="color: #F5F5F7; text-decoration: none">Notes</a> · [DATE] · 6 min read</p>
      <h1 style="margin: 0 auto; max-width: 26ch; font-weight: 500; font-size: clamp(40px, 5.6vw, 76px); line-height: 1.04; letter-spacing: -0.03em; text-wrap: balance">One article, four renderers. <span class="q-g">What happens when everything wants to show it.</span></h1>
      <p style="margin: 28px 0 0; display: inline-flex; align-items: center; gap: 10px; font-size: 15px; color: #F5F5F7"><span role="img" aria-label="Photo of Ryan Hefner" style="flex: 0 0 auto; width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(180deg, #D8C1FF 0%, #F3A7C6 34%, #FF9B66 66%, #F5CF73 100%); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.10)"></span><a href="#" style="text-decoration: none">Ryan Hefner</a></p>
    </header>

    <div style="max-width: 1120px; margin: 0 auto; padding: 72px 24px 0">
      <figure style="margin: 0">
        <div role="img" aria-label="Placeholder for the article's lead image" style="height: clamp(240px, 36vw, 520px); border-radius: 28px; background: linear-gradient(180deg, #D8C1FF 0%, #F3A7C6 34%, #FF9B66 66%, #F5CF73 100%)"></div>
        <figcaption style="margin: 14px 0 0; max-width: 680px; font-size: 14px; color: #A1A1A6"><span style="color: #F5F5F7">Fig. 1</span> — [The lead image’s caption.]</figcaption>
      </figure>
    </div>

    <div class="q-art" style="padding-top: 72px">
      <div class="q-arow" style="margin-top: 0px"><div style="min-width: 0"><div style="border-radius: 16px; background: #1C1C1E; padding: 24px 28px">
        <p style="margin: 0 0 10px; font-size: 14px; color: #A1A1A6">In short</p>
        <ol style="margin: 0; padding: 0; list-style: none; font-size: 17px">
          <li style="display: flex; gap: 14px; padding: 4px 0"><span style="flex: 0 0 auto; color: #A1A1A6">1</span>Components are defined once, outside any framework.</li>
          <li style="display: flex; gap: 14px; padding: 4px 0"><span style="flex: 0 0 auto; color: #A1A1A6">2</span>Headless React views; Chakra is its own package.</li>
          <li style="display: flex; gap: 14px; padding: 4px 0"><span style="flex: 0 0 auto; color: #A1A1A6">3</span>Every customization keeps the contract.</li>
        </ol>
      </div></div></div>
      <div class="q-arow" style="margin-top: 48px"><div style="min-width: 0"><p class="q-body" style="margin: 0; font-size: 19px; line-height: 1.65; color: #F5F5F7">A callout is a small thing: a box, a word of warning, a tip. But the moment an article leaves the page it was written for, that box has to survive a feed reader, a newsletter and an editor’s preview pane<sup style="line-height: 0"><a href="#fn-one-article-1" id="fnref-one-article-1" class="q-fnref q-ref1" aria-label="Note 1">1</a></sup>, each with different rules about what may run.</p><div class="q-fninline" role="note" style="margin-top: 12px; grid-template-columns: 18px 1fr 24px; padding: 10px 12px; border-radius: 10px; background: #1C1C1E; font-size: 14px; line-height: 1.5; color: #D1D1D6"><span style="color: {{accent}}; font-weight: 500">1</span><span>Feed readers drop scripts and most styles, email clients drop more, and preview panes often render without the site’s CSS at all.</span><button type="button" aria-label="Close note 1" style="border: 0; background: none; padding: 0; font: inherit; color: #A1A1A6; cursor: pointer">×</button></div></div><div class="q-sidecol"><aside class="q-side" aria-label="Note 1" style="position: absolute; left: 0; right: 0; top: 68px; padding-left: 12px; display: grid; grid-template-columns: 16px 1fr; font-size: 13px; line-height: 1.5; color: #A1A1A6"><span aria-hidden="true" style="color: {{accent}}; font-weight: 500">1</span><span>Feed readers drop scripts and most styles, email clients drop more, and preview panes often render without the site’s CSS at all.</span></aside></div></div>
      <div class="q-arow" style="margin-top: 24px"><div style="min-width: 0"><p class="q-body" style="margin: 0; font-size: 19px; line-height: 1.65; color: #F5F5F7">Postkit treats the callout as <a href="#" style="color: {{accent}}; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px">content rather than markup</a>. Install the renderer you want and the article comes along unchanged.</p></div><div class="q-sidecol"><aside class="q-side q-aside" style="position: absolute; left: 0; right: 0; top: 62px; padding-left: 12px; font-size: 13px; line-height: 1.5; color: #A1A1A6"><span style="display: block; margin-bottom: 2px; font-size: 12px; color: #8E8E93">Aside</span>Postkit grew out of Prismark’s need to render the same components in the editor and on the page.</aside></div></div>
      <div class="q-arow" style="margin-top: 32px"><div style="min-width: 0"><div class="q-mono" style="border-radius: 14px; background: #161618; color: #F5F5F7; padding: 18px 22px; font-size: 14px; line-height: 1.75">
        <div><span style="color: #98989D">$</span> npm install @postkit/react</div>
        <div style="color: #98989D">added 1 package in 2s</div>
      </div></div></div>
      <div class="q-arow" style="margin-top: 96px"><div style="min-width: 0"><h2 id="write-once" style="margin: 0; font-weight: 500; font-size: clamp(28px, 3vw, 36px); line-height: 1.12; letter-spacing: -0.02em">Write the component once. <span class="q-g">A tag in MDX, a directive in Markdown, one definition behind both.</span></h2></div></div>
      <div class="q-arow" style="margin-top: 24px"><div style="min-width: 0"><p class="q-body" style="margin: 0; font-size: 19px; line-height: 1.65; color: #F5F5F7">Both forms validate against the same definition, so a typo in a <a href="#" style="color: {{accent}}; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px">tone</a> fails the build instead of the reader<sup style="line-height: 0"><a href="#fn-one-article-2" id="fnref-one-article-2" class="q-fnref " style="background: {{tint}}" aria-label="Note 2">2</a></sup>.</p></div><div class="q-sidecol"><aside class="q-side" aria-label="Note 2" style="position: absolute; left: 0; right: 0; top: 37px; display: flex; gap: 10px; font-size: 13px; line-height: 1.5; color: #F5F5F7"><span aria-hidden="true" style="flex: 0 0 2px; align-self: stretch; border-radius: 2px; background: linear-gradient(180deg, #D4B8FF 0%, #F4A3BE 32%, #FF8B57 64%, #F3C460 100%)"></span><span style="display: grid; grid-template-columns: 16px 1fr"><span aria-hidden="true" style="color: {{accent}}; font-weight: 500">2</span><span>Directives are checked against the same schema as MDX props, and the error names the file and line.</span></span></aside></div></div>
      <div class="q-arow" style="margin-top: 32px"><div style="min-width: 0"><div style="border-radius: 14px; background: #1C1C1E; overflow: hidden">
        <div class="q-mono" style="display: flex; justify-content: space-between; align-items: center; padding-left: 20px; font-size: 12.5px; color: #A1A1A6; border-bottom: 1px solid #272729">
          <span>post.mdx</span>

        </div>
        <pre class="q-mono" style="margin: 0; padding: 18px 20px; font-size: 14px; line-height: 1.75; white-space: pre-wrap">&lt;Callout tone="tip" title="Keep the content"&gt;
  Change the renderer without changing the article.
&lt;/Callout&gt;</pre>
      </div></div></div>
      <div class="q-arow" style="margin-top: 0px"><div style="min-width: 0"><aside style="margin-top: 16px; border-radius: 14px; background: {{tint}}; padding: 18px 22px; display: flex; gap: 14px">
        <span aria-hidden="true" style="flex: 0 0 auto; width: 8px; height: 8px; margin-top: 9px; border-radius: 50%; background: {{accent}}"></span>
        <div><p style="margin: 0 0 2px; font-weight: 500">Keep the content</p><p style="margin: 0; color: #D1D1D6">Change the renderer without changing the article.</p></div>
      </aside></div></div>
      <div class="q-arow" style="margin-top: 0px"><div class="q-wide" style="min-width: 0"><blockquote style="margin: 96px auto; max-width: 860px; padding: 0; text-align: center">
        <p style="margin: 0; font-weight: 500; font-size: clamp(30px, 3.6vw, 44px); line-height: 1.15; letter-spacing: -0.025em">“The file stays plain text. <span class="q-g">The renderer is a choice you can change later.”</span></p>
        <footer style="margin-top: 16px; font-size: 15px; color: #A1A1A6">Postkit design principles</footer>
      </blockquote></div></div>
      <div class="q-arow" style="margin-top: 0px"><div style="min-width: 0"><h2 id="restyle" style="margin: 0; font-weight: 500; font-size: clamp(28px, 3vw, 36px); line-height: 1.12; letter-spacing: -0.02em">Restyle without forking. <span class="q-g">The callout above is the stock component under this site’s theme.</span></h2></div></div>
      <div class="q-arow" style="margin-top: 24px"><div style="min-width: 0"><p class="q-body" style="margin: 0; font-size: 19px; line-height: 1.65; color: #F5F5F7">Go further only when you need to. Each step keeps the component’s contract<sup style="line-height: 0"><a href="#fn-one-article-3" id="fnref-one-article-3" class="q-fnref " aria-label="Note 3">3</a></sup>.</p></div><div class="q-sidecol"><aside class="q-side" aria-label="Note 3" style="position: absolute; left: 0; right: 0; top: 37px; padding-left: 12px; display: grid; grid-template-columns: 16px 1fr; font-size: 13px; line-height: 1.5; color: #A1A1A6"><span aria-hidden="true" style="color: {{accent}}; font-weight: 500">3</span><span>The contract is the definition: props, parts and their data-postkit-part names. Views can change; those can’t.</span></aside></div></div>
      <div class="q-arow" style="margin-top: 32px"><div style="min-width: 0"><ol style="margin: 0; padding: 8px 24px; list-style: none; border-radius: 16px; background: #1C1C1E">
        <li style="display: flex; gap: 16px; padding: 16px 0; border-bottom: 1px solid #272729"><span aria-hidden="true" style="flex: 0 0 26px; height: 26px; border-radius: 50%; background: {{tint}}; color: {{accent}}; font-size: 13px; font-weight: 500; display: flex; align-items: center; justify-content: center">1</span><span><span style="font-weight: 500">Theme the parts.</span> <span style="color: #D1D1D6">Style <code class="q-mono" style="font-size: 14px">root</code>, <code class="q-mono" style="font-size: 14px">icon</code> and <code class="q-mono" style="font-size: 14px">title</code> with CSS or a recipe.</span></span></li>
        <li style="display: flex; gap: 16px; padding: 16px 0; border-bottom: 1px solid #272729"><span aria-hidden="true" style="flex: 0 0 26px; height: 26px; border-radius: 50%; background: {{tint}}; color: {{accent}}; font-size: 13px; font-weight: 500; display: flex; align-items: center; justify-content: center">2</span><span><span style="font-weight: 500">Swap one part.</span> <span style="color: #D1D1D6">Give the icon slot your own mark; the rest stays stock.</span></span></li>
        <li style="display: flex; gap: 16px; padding: 16px 0"><span aria-hidden="true" style="flex: 0 0 26px; height: 26px; border-radius: 50%; background: {{tint}}; color: {{accent}}; font-size: 13px; font-weight: 500; display: flex; align-items: center; justify-content: center">3</span><span><span style="font-weight: 500">Eject the view.</span> <span style="color: #D1D1D6">Own the source; the definition stays upstream.</span></span></li>
      </ol></div></div>
      <div class="q-arow" style="margin-top: 0px"><div style="min-width: 0"><a href="#" style="margin-top: 48px; display: flex; gap: 18px; align-items: center; border-radius: 16px; background: #1C1C1E; padding: 14px; text-decoration: none">
        <span aria-hidden="true" style="flex: 0 0 120px; height: 84px; border-radius: 10px; background: {{tint}}"></span>
        <span style="min-width: 0">
          <span style="display: block; font-size: 13px; color: #A1A1A6">github.com</span>
          <span style="display: block; font-weight: 500">postkit-org/postkit-js</span>
          <span style="display: block; font-size: 15px; color: #A1A1A6">Portable web and email components, Markdown tooling and framework adapters.</span>
        </span>
      </a></div></div>
      <div class="q-arow" style="margin-top: 0px"><div style="min-width: 0"><section class="q-endnotes" aria-label="Notes" style="margin-top: 64px"><hr style="margin: 0 0 16px; width: 64px; border: 0; border-top: 1px solid #48484A"><ol style="margin: 0; padding: 0; list-style: none; font-size: 15px; line-height: 1.55"><li id="fn-one-article-1" style="display: grid; grid-template-columns: 24px 1fr; padding: 0 0 0"><span style="color: #8E8E93">1.</span><span style="color: #D1D1D6">Feed readers drop scripts and most styles, email clients drop more, and preview panes often render without the site’s CSS at all.<a href="#fnref-one-article-1" aria-label="Back to reference 1" style="margin-left: 6px; color: {{accent}}; text-decoration: none">↩</a></span></li><li id="fn-one-article-2" style="display: grid; grid-template-columns: 24px 1fr; padding: 10px 0 0"><span style="color: #8E8E93">2.</span><span style="color: #D1D1D6">Directives are checked against the same schema as MDX props, and the error names the file and line.<a href="#fnref-one-article-2" aria-label="Back to reference 2" style="margin-left: 6px; color: {{accent}}; text-decoration: none">↩</a></span></li><li id="fn-one-article-3" style="display: grid; grid-template-columns: 24px 1fr; padding: 10px 0 0"><span style="color: #8E8E93">3.</span><span style="color: #D1D1D6">The contract is the definition: props, parts and their data-postkit-part names. Views can change; those can’t.<a href="#fnref-one-article-3" aria-label="Back to reference 3" style="margin-left: 6px; color: {{accent}}; text-decoration: none">↩</a></span></li></ol></section></div></div>
