    <p class="q-mono" style="margin: 0; font-size: 13px; color: #6E6E73">postkit.org · Interaction states</p>
    <h1 style="margin: 12px 0 0; font-weight: 500; font-size: 44px; line-height: 1.08; letter-spacing: -0.03em">Every control, every state. <span class="q-g">Quiet until you touch it.</span></h1>
    <ul style="margin: 40px 0 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 12px"><li style="flex: 1 1 200px; padding: 16px 18px; border-radius: 16px; background: #F5F5F4"><p style="margin: 0; font-weight: 500; font-size: 15px">Focus</p><p style="margin: 6px 0 0; font-size: 13.5px; line-height: 1.5; color: #3A3A3C">2px accent ring, 2px offset, following the control’s radius. Only on <code class="q-mono" style="font-size: 13px">:focus-visible</code>.</p></li><li style="flex: 1 1 200px; padding: 16px 18px; border-radius: 16px; background: #F5F5F4"><p style="margin: 0; font-weight: 500; font-size: 15px">Hover</p><p style="margin: 6px 0 0; font-size: 13.5px; line-height: 1.5; color: #3A3A3C">Colour only, 120ms ease-out. Nothing moves or grows.</p></li><li style="flex: 1 1 200px; padding: 16px 18px; border-radius: 16px; background: #F5F5F4"><p style="margin: 0; font-weight: 500; font-size: 15px">Pressed</p><p style="margin: 6px 0 0; font-size: 13.5px; line-height: 1.5; color: #3A3A3C">Buttons scale to 98% while held. Links and tiles only darken.</p></li><li style="flex: 1 1 200px; padding: 16px 18px; border-radius: 16px; background: #F5F5F4"><p style="margin: 0; font-weight: 500; font-size: 15px">Touch</p><p style="margin: 6px 0 0; font-size: 13.5px; line-height: 1.5; color: #3A3A3C">No hover states. Every target is at least 44 by 44.</p></li><li style="flex: 1 1 200px; padding: 16px 18px; border-radius: 16px; background: #F5F5F4"><p style="margin: 0; font-weight: 500; font-size: 15px">Reduced motion</p><p style="margin: 6px 0 0; font-size: 13.5px; line-height: 1.5; color: #3A3A3C">No scaling, no fades. State changes are instant.</p></li></ul>
