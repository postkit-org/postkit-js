    <p style="margin: 20px 0 0; max-width: 48em; font-size: 17px; color: #3A3A3C">Two new components, <b style="font-weight: 500">Footnote</b> and <b style="font-weight: 500">Footnotes</b>, plus a margin layout they share with <b style="font-weight: 500">Aside</b>. Written once in standard Markdown; placed at the end, in the margin, or beside the line; styled to a house look with props and tokens.</p>

enter; justify-content: center; min-width: 17px; height: 17px; padding: 0 4px; box-sizing: border-box; margin: 0 1px; border-radius: 999px; background: #E2E8FB; color: #2F5BE3; font-size: 11px; font-weight: 600; line-height: 1; text-decoration: none; vertical-align: 0.18em">2</a>.</p><p style="margin: 8px 0 0; font-size: 13.5px; color: #6E6E73">A filled mark that reads as a control. Pairs well with notes that open in place.</p></div></div><div><p class="m" style="margin: 0 0 12px; font-size: 12px; color: #86868B">numbering="symbol"</p><div><p style="margin: 0; font-size: 17px; line-height: 1.6">…in plain text<sup style="line-height: 0"><a href="#" style="color: #2F5BE3; text-decoration: none; font-size: 0.7em; font-weight: 500; padding: 0 1px">*</a></sup> and lets each renderer decide<sup style="line-height: 0"><a href="#" style="color: #2F5BE3; text-decoration: none; font-size: 0.7em; font-weight: 500; padding: 0 1px">†</a></sup>.</p><p style="margin: 8px 0 0; font-size: 13.5px; color: #6E6E73">The book convention: *, †, ‡ and on. Best for three or four notes per article.</p></div></div></div><p style="margin: 20px 0 0; font-size: 15px; color: #6E6E73">Numbering is <span class="m" style="font-size: 13px">decimal</span> by default, or <span class="m" style="font-size: 13px">lower-roman</span>, <span class="m" style="font-size: 13px">lower-alpha</span>, <span class="m" style="font-size: 13px">symbol</span>, or a function. Labels in the source are ids, never numbers: notes are numbered in the order they are first referenced, so moving a paragraph renumbers everything.</p>

  <p style="margin: 0; font-size: 17px; line-height: 1.6">Postkit keeps the article in plain text<sup style="line-height: 0"><a href="#" style="color: #2F5BE3; text-decoration: none; font-size: 0.7em; font-weight: 500; padding: 0 1px">1</a></sup> and lets each renderer decide how notes appear. The same file becomes a web page, an email and a feed entry without a second copy to keep in sync.</p>
  <aside style="margin-top: 2px; display: grid; grid-template-columns: 18px 1fr; font-size: 13.5px; line-height: 1.5; color: #3A3A3C"><span aria-hidden="true" style="color: #86868B; font-weight: 500">1</span><span>Markdown with directives, or MDX. Both parse to the same portable document.</span></aside>
  <p style="margin: 0; font-size: 17px; line-height: 1.6">Components are defined once, outside any framework. Views read the definition and add only presentation, so the headless and Chakra versions cannot drift apart.</p>
  <aside style="margin-top: 2px; font-size: 13.5px; line-height: 1.5; color: #6E6E73"><span style="display: block; margin-bottom: 2px; font-size: 12px; color: #86868B">Aside</span>Postkit grew out of Prismark’s need to render the same components in the editor and on the page.</aside>
  <p style="margin: 0; font-size: 17px; line-height: 1.6">Which renderer a site uses is a choice made once, in configuration<sup style="line-height: 0"><a href="#" style="background: #E2E8FB; border-radius: 4px; color: #2F5BE3; text-decoration: none; font-size: 0.7em; font-weight: 500; padding: 0 1px">2</a></sup>, and it can change later without touching a single article.</p>
  <aside style="background: #E6EBFC; margin-left: -10px; margin-right: -10px; padding: 8px 10px; border-radius: 8px; margin-top: 2px; display: grid; grid-template-columns: 18px 1fr; font-size: 13.5px; line-height: 1.5; color: #3A3A3C"><span aria-hidden="true" style="color: #2F5BE3; font-weight: 500">2</span><span>Headless, Chakra, email or web components, chosen per site rather than per article.</span></aside>
</div><div style="margin-top: 32px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px; align-items: start"><div><p class="m" style="margin: 0 0 12px; font-size: 12px; color: #86868B"></p><p style="margin: 0; font-size: 14.5px; line-height: 1.55; color: #6E6E73"><b style="font-weight: 500; color: #1D1D1F">Numbered sidenote.</b> A footnote moved beside its line. Hover or focus on either half tints both.</p></div><div><p class="m" style="margin: 0 0 12px; font-size: 12px; color: #86868B"></p><p style="margin: 0; font-size: 14.5px; line-height: 1.55; color: #6E6E73"><b style="font-weight: 500; color: #1D1D1F">Aside.</b> The authored version: no number, written where it sits, and placed in the margin by the same layout.</p></div><div><p class="m" style="margin: 0 0 12px; font-size: 12px; color: #86868B"></p><p style="margin: 0; font-size: 14.5px; line-height: 1.55; color: #6E6E73"><b style="font-weight: 500; color: #1D1D1F">Collisions.</b> When two notes would overlap, the second moves down. When the margin runs out, notes fall back to the end list.</p></div></div><p style="margin: 20px 0 0; font-size: 15px; color: #6E6E73">Side placement needs a margin of about 232px. Below <span class="m" style="font-size: 13px">sideBreakpoint</span> (default 1024px) the same notes render as the end list, and Asides return to the text column as a quiet block.</p>
    </div>
  </section>
  <section style="display: flex; flex-wrap: wrap; gap: 32px 56px; padding: 56px 0; border-top: 1px solid #ECECEA">

      <p style="margin: 8px 0 0; font-size: 15px; line-height: 1.5; color: #6E6E73">Narrow screens get the end list, with marks that can open the note in place.</p>
      <p class="m" style="margin: 14px 0 0; font-size: 12.5px; line-height: 1.8; color: #6E6E73">sideBreakpoint · 1024px</p>
    </div>

<div style="display: flex; gap: 40px; flex-wrap: wrap"><div style="width: 300px; border-radius: 36px; border: 1px solid #E2E2DF; padding: 10px; background: #FFFFFF"><div style="border-radius: 28px; background: #FFFFFF; overflow: hidden; padding: 28px 20px 24px; font-size: 16px"><p style="margin: 0 0 16px; font-weight: 500; font-size: 22px; line-height: 1.15; letter-spacing: -0.02em">One article, every renderer.</p><p style="margin: 0; font-size: 16px; line-height: 1.6">Postkit keeps the article in plain text<a href="#" style="display: inline-flex; align-items: center; justify-content: center; min-width: 17px; height: 17px; padding: 0 4px; box-sizing: border-box; margin: 0 1px; border-radius: 999px; background: #2F5BE3; color: #FFFFFF; font-size: 11px; font-weight: 600; line-height: 1; text-decoration: none; vertical-align: 0.18em">1</a> and lets each renderer decide how notes appear.</p><div style="margin-top: 10px; display: grid; grid-template-columns: 20px 1fr; padding: 10px 12px; border-radius: 10px; background: #F5F5F4; font-size: 13.5px; line-height: 1.5; color: #3A3A3C"><span style="color: #2F5BE3; font-weight: 500">1</span><span>Markdown with directives, or MDX. Both parse to the same portable document.</span></div><p style="margin: 16px 0 0; font-size: 16px; line-height: 1.6">Which renderer a site uses is a choice made once<a href="#" style="display: inline-flex; align-items: center; justify-content: center; min-width: 17px; height: 17px; padding: 0 4px; box-sizing: border-box; margin: 0 1px; border-radius: 999px; background: #E2E8FB; color: #2F5BE3; font-size: 11px; font-weight: 600; line-height: 1; text-decoration: none; vertical-align: 0.18em">2</a>.</p></div></div><div style="width: 300px; border-radius: 36px; border: 1px solid #E2E2DF; padding: 10px; background: #FFFFFF"><div style="border-radius: 28px; background: #FFFFFF; overflow: hidden; padding: 28px 20px 24px; font-size: 16px"><p style="margin: 0 0 16px; font-size: 16px; line-height: 1.6; color: #6E6E73">…made once, in configuration.</p><section aria-label="Footnotes"><hr style="margin: 0 0 14px; width: 64px; border: 0; border-top: 1px solid #C9C9C6"><ol style="margin: 0; padding: 0; list-style: none; font-size: 14px; line-height: 1.55"><li style="display: grid; grid-template-columns: 24px 1fr; gap: 4px; padding: 0 0 0"><span aria-hidden="true" style="font-variant-numeric: tabular-nums; color: #86868B">1.</span><span style="color: #3A3A3C">Markdown with directives, or MDX. Both parse to the same portable document.<a href="#" aria-label="Back to reference 1" style="margin-left: 6px; color: #2F5BE3; text-decoration: none">↩</a></span></li><li style="display: grid; grid-template-columns: 24px 1fr; gap: 4px; padding: 8px 0 0; background: #E6EBFC; margin: 0 -10px; padding: 6px 10px; border-radius: 8px"><span aria-hidden="true" style="font-variant-numeric: tabular-nums; color: #86868B">2.</span><span style="color: #3A3A3C">Headless, Chakra, email or web components, chosen per site rather than per article.<a href="#" aria-label="Back to reference 2" style="margin-left: 6px; color: #2F5BE3; text-decoration: none">↩</a></span></li></ol></section><p style="margin: 18px 0 0; font-size: 13px; color: #6E6E73">Jumping to note 2 tints it until you return with ↩.</p></div></div></div><p style="margin: 20px 0 0; font-size: 15px; color: #6E6E73">On a phone, <span class="m" style="font-size: 13px">side</span> becomes <span class="m" style="font-size: 13px">end</span>, and marks can open the note in place. The marks keep a 24px tap target even when drawn smaller.</p>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px; align-items: start"><div><div style="padding: 28px; border-radius: 20px; border: 1px solid #ECECEA; font-family: Georgia, 'Iowan Old Style', serif">
  <p style="margin: 0 0 16px; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #6E6E73; font-family: 'Inter Tight', sans-serif">Journal</p>
  <p style="margin: 0; font-size: 18px; line-height: 1.6; color: #1D1D1F">Postkit keeps the article in plain text<sup style="line-height: 0"><a href="#" style="color: #1D1D1F; text-decoration: none; font-size: 0.7em; font-weight: 500; padding: 0 1px">*</a></sup> and lets each renderer decide how the notes appear: at the end, in the margin, or beside the sentence that needs them<sup style="line-height: 0"><a href="#" style="color: #1D1D1F; text-decoration: none; font-size: 0.7em; font-weight: 500; padding: 0 1px">†</a></sup>.</p>

  <p style="margin: 0; font-size: 16px; line-height: 1.6; color: #1D1D1F">Postkit keeps the article in plain text<a href="#" style="color: #2F5BE3; text-decoration: none; font-size: 0.82em; font-weight: 500; font-variant-numeric: tabular-nums; padding: 0 1px">[1]</a> and lets each renderer decide how the notes appear: at the end, in the margin, or beside the sentence that needs them<a href="#" style="color: #2F5BE3; text-decoration: none; font-size: 0.82em; font-weight: 500; font-variant-numeric: tabular-nums; padding: 0 1px">[2]</a>.</p>

&lt;Footnotes title=&quot;Notes&quot; /&gt;
&lt;AuthorCard … /&gt;</pre></div></div><p style="margin: 20px 0 0; font-size: 15px; color: #6E6E73">GFM syntax is the default because every Markdown tool already understands it. The inline directive is for writers who want the note where they think it. <span class="m" style="font-size: 13px">::footnotes</span> or <span class="m" style="font-size: 13px">&lt;Footnotes /&gt;</span> places the list; without it, the list closes the article. A reference with no note fails the build with its line number; a note nobody references is a warning.</p>

    <p style="margin: 0">Postkit keeps the article in plain text<sup style="font-size: 10px; line-height: 0">1</sup> and lets each renderer decide how notes appear.<sup style="font-size: 10px; line-height: 0">2</sup></p>
    <hr style="margin: 16px 0 10px; width: 48px; border: 0; border-top: 1px solid #C9C9C6; text-align: left; margin-left: 0">
    <p style="margin: 0; font-size: 13px; color: #3A3A3C">1. Markdown with directives, or MDX. Both parse to the same portable document.</p><p style="margin: 6px 0 0; font-size: 13px; color: #3A3A3C">2. Headless, Chakra, email or web components, chosen per site rather than per article.</p>

    <p style="margin: 0; font-size: 15px; line-height: 1.6">Postkit keeps the article in plain text<span style="display: inline-flex; align-items: center; justify-content: center; min-width: 17px; height: 17px; margin: 0 2px; border-radius: 5px; background: #2F5BE3; color: #FFFFFF; font-size: 11px; font-weight: 600; vertical-align: 0.15em">1</span> and lets each renderer decide.</p>

    <p style="margin: 8px 0 0; font-size: 12.5px; color: #6E6E73">Edit the note in place. Numbers update as you move text.</p>
  </div></div></div><p style="margin: 20px 0 0; font-size: 15px; color: #6E6E73">Footnotes join the portable vocabulary in <span class="m" style="font-size: 13px">@postkit/core</span> as two nodes, <span class="m" style="font-size: 13px">footnoteReference</span> and <span class="m" style="font-size: 13px">footnoteDefinition</span>, so they survive every renderer instead of falling back to literal text. Email always uses end notes with unlinked numbers, since in-message anchors are unreliable across clients. Feed and web ids are prefixed per article, <span class="m" style="font-size: 13px">fn-{slug}-1</span>, so a reader showing several posts on one page never links to the wrong note.</p>
