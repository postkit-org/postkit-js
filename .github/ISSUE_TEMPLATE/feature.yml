name: Feature request
description: Propose a focused addition to the portable publishing contract or an integration.
title: '[Feature]: '
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Publishing problem
      description: Describe the author, reader, renderer, or integration problem rather than only the desired API.
    validations:
      required: true
  - type: dropdown
    id: boundary
    attributes:
      label: Owning boundary
      options:
        - Portable component contract
        - React rendering
        - Markdown or MDX
        - Framework adapter
        - Astro integration
        - Unfurling or metadata
        - Documentation or examples
        - Unsure
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain how authored content and host-application responsibilities should interact.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
